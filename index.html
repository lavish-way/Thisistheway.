<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 800px;
            height: 500px;
        }
        
        canvas {
            border: 3px solid #444;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        #welcomeScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ff8c00;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #welcomeScreen h1 {
            color: white;
            font-size: 48px;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 30px;
        }
        
        #startButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #990000, 0 10px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.1s;
        }
        
        #startButton:hover {
            background-color: #ff3333;
        }
        
        #startButton:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #990000, 0 5px 5px rgba(0, 0, 0, 0.2);
        }
        
        #levelComplete {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            color: white;
            font-size: 36px;
        }
        
        #nextLevelButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        #levelIndicator {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="welcomeScreen">
            <h1>Welcome to Angry Birds!</h1>
            <button id="startButton">START</button>
        </div>
        
        <div id="levelComplete">
            <h2>Level Complete!</h2>
            <button id="nextLevelButton">Next Level</button>
        </div>
        
        <div id="levelIndicator">Level: 1</div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const startButton = document.getElementById('startButton');
        const levelComplete = document.getElementById('levelComplete');
        const nextLevelButton = document.getElementById('nextLevelButton');
        const levelIndicator = document.getElementById('levelIndicator');
        
        let gameStarted = false;
        let currentLevel = 1;
        let birds = [];
        let pigs = [];
        let blocks = [];
        let slingshot = { x: 150, y: 350 };
        let currentBird = null;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let backgroundImages = [];
        let gameBackground = null;
        let score = 0;
        let birdLaunched = false;
        let levelCompleted = false;
        
        // Load background images
        function loadBackgrounds() {
            const oceanBg = new Image();
            oceanBg.src = 'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
            
            const desertBg = new Image();
            desertBg.src = 'https://images.unsplash.com/photo-1509316785289-025f5b846b35?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
            
            const islandBg = new Image();
            islandBg.src = 'https://images.unsplash.com/photo-1505228395891-9a51e7e86bf6?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
            
            backgroundImages = [oceanBg, desertBg, islandBg];
            gameBackground = oceanBg;
        }
        
        // Initialize game
        function initGame() {
            birds = [];
            pigs = [];
            blocks = [];
            birdLaunched = false;
            levelCompleted = false;
            
            // Set background based on level
            gameBackground = backgroundImages[currentLevel - 1];
            
            // Create slingshot bird
            birds.push({
                x: slingshot.x,
                y: slingshot.y,
                radius: 20,
                color: '#ff0000',
                velocity: { x: 0, y: 0 },
                launched: false,
                inSlingshot: true
            });
            
            currentBird = birds[0];
            
            // Create pigs and blocks based on level
            if (currentLevel === 1) {
                // Triangle formation
                createPigs(3);
                createTriangleStructure(500, 300);
            } else if (currentLevel === 2) {
                // Square formation
                createPigs(5);
                createSquareStructure(500, 300);
            } else if (currentLevel === 3) {
                // Rectangle formation with more pigs
                createPigs(8);
                createRectangleStructure(500, 300);
            }
            
            updateLevelIndicator();
        }
        
        function createPigs(count) {
            for (let i = 0; i < count; i++) {
                pigs.push({
                    x: 500 + Math.random() * 50,
                    y: 300 + Math.random() * 50,
                    radius: 15,
                    color: '#00aa00',
                    health: 1
                });
            }
        }
        
        function createTriangleStructure(x, y) {
            const blockSize = 30;
            const rows = 4;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col <= row; col++) {
                    blocks.push({
                        x: x + col * blockSize - (row * blockSize / 2),
                        y: y - row * blockSize,
                        width: blockSize,
                        height: blockSize,
                        color: '#8B4513',
                        health: 1
                    });
                }
            }
        }
        
        function createSquareStructure(x, y) {
            const blockSize = 30;
            const size = 4;
            
            for (let row = 0; row < size; row++) {
                for (let col = 0; col < size; col++) {
                    blocks.push({
                        x: x + col * blockSize - (size * blockSize / 2),
                        y: y - row * blockSize,
                        width: blockSize,
                        height: blockSize,
                        color: '#8B4513',
                        health: 1
                    });
                }
            }
        }
        
        function createRectangleStructure(x, y) {
            const blockSize = 30;
            const width = 6;
            const height = 3;
            
            for (let row = 0; row < height; row++) {
                for (let col = 0; col < width; col++) {
                    blocks.push({
                        x: x + col * blockSize - (width * blockSize / 2),
                        y: y - row * blockSize,
                        width: blockSize,
                        height: blockSize,
                        color: '#8B4513',
                        health: 1
                    });
                }
            }
        }
        
        function updateLevelIndicator() {
            levelIndicator.textContent = `Level: ${currentLevel}`;
        }
        
        // Game loop
        function gameLoop() {
            if (!gameStarted) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            if (gameBackground.complete) {
                ctx.drawImage(gameBackground, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#87CEEB'; // Fallback color
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // Update and draw birds
            birds.forEach((bird, index) => {
                if (bird.launched) {
                    // Apply gravity
                    bird.velocity.y += 0.5;
                    
                    // Update position
                    bird.x += bird.velocity.x;
                    bird.y += bird.velocity.y;
                    
                    // Check boundaries
                    if (bird.x > canvas.width || bird.x < 0 || bird.y > canvas.height) {
                        birds.splice(index, 1);
                    }
                    
                    // Check collisions
                    checkCollisions(bird);
                }
                
                // Draw bird
                ctx.beginPath();
                ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
                ctx.fillStyle = bird.color;
                ctx.fill();
                ctx.closePath();
                
                // Draw eyes and beak for the bird
                if (bird.inSlingshot || bird.launched) {
                    // Eyes
                    ctx.beginPath();
                    ctx.arc(bird.x - 8, bird.y - 5, 5, 0, Math.PI * 2);
                    ctx.arc(bird.x + 8, bird.y - 5, 5, 0, Math.PI * 2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    ctx.closePath();
                    
                    // Pupils
                    ctx.beginPath();
                    ctx.arc(bird.x - 8, bird.y - 5, 2, 0, Math.PI * 2);
                    ctx.arc(bird.x + 8, bird.y - 5, 2, 0, Math.PI * 2);
                    ctx.fillStyle = 'black';
                    ctx.fill();
                    ctx.closePath();
                    
                    // Beak
                    ctx.beginPath();
                    ctx.moveTo(bird.x + 15, bird.y);
                    ctx.lineTo(bird.x + 25, bird.y - 5);
                    ctx.lineTo(bird.x + 25, bird.y + 5);
                    ctx.fillStyle = '#FFD700';
                    ctx.fill();
                    ctx.closePath();
                }
            });
            
            // Draw pigs
            pigs.forEach(pig => {
                ctx.beginPath();
                ctx.arc(pig.x, pig.y, pig.radius, 0, Math.PI * 2);
                ctx.fillStyle = pig.color;
                ctx.fill();
                ctx.closePath();
                
                // Draw pig face
                ctx.beginPath();
                ctx.arc(pig.x - 5, pig.y - 3, 3, 0, Math.PI * 2); // Left eye
                ctx.arc(pig.x + 5, pig.y - 3, 3, 0, Math.PI * 2); // Right eye
                ctx.fillStyle = 'black';
                ctx.fill();
                ctx.closePath();
                
                // Nose
                ctx.beginPath();
                ctx.arc(pig.x, pig.y + 3, 5, 0, Math.PI * 1.3, true);
                ctx.fillStyle = 'black';
                ctx.fill();
                ctx.closePath();
            });
            
            // Draw blocks
            blocks.forEach(block => {
                ctx.fillStyle = block.color;
                ctx.fillRect(block.x, block.y, block.width, block.height);
                
                // Draw lines to make it look like wood
                ctx.strokeStyle = '#5D2906';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(block.x, block.y + block.height / 3);
                ctx.lineTo(block.x + block.width, block.y + block.height / 3);
                ctx.moveTo(block.x, block.y + block.height * 2/3);
                ctx.lineTo(block.x + block.width, block.y + block.height * 2/3);
                ctx.stroke();
            });
            
            // Draw slingshot
            drawSlingshot();
            
            // Check level completion
            if (!levelCompleted && pigs.length === 0 && birdLaunched) {
                levelCompleted = true;
                if (currentLevel < 3) {
                    levelComplete.style.display = 'flex';
                } else {
                    levelComplete.querySelector('h2').textContent = 'Game Completed!';
                    levelComplete.querySelector('button').textContent = 'Play Again';
                    levelComplete.style.display = 'flex';
                }
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        function drawSlingshot() {
            // Draw slingshot (Y shape)
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 10;
            
            // Left band
            ctx.beginPath();
            ctx.moveTo(slingshot.x - 20, slingshot.y + 50);
            ctx.lineTo(slingshot.x - 10, slingshot.y + 30);
            ctx.lineTo(slingshot.x - 5, slingshot.y);
            ctx.stroke();
            
            // Right band
            ctx.beginPath();
            ctx.moveTo(slingshot.x + 20, slingshot.y + 50);
            ctx.lineTo(slingshot.x + 10, slingshot.y + 30);
            ctx.lineTo(slingshot.x + 5, slingshot.y);
            ctx.stroke();
            
            // Draw rubber bands if dragging
            if (isDragging && currentBird && currentBird.inSlingshot) {
                ctx.strokeStyle = '#FF6347';
                ctx.lineWidth = 5;
                
                // Left rubber band
                ctx.beginPath();
                ctx.moveTo(slingshot.x - 5, slingshot.y);
                ctx.lineTo(currentBird.x, currentBird.y);
                ctx.stroke();
                
                // Right rubber band
                ctx.beginPath();
                ctx.moveTo(slingshot.x + 5, slingshot.y);
                ctx.lineTo(currentBird.x, currentBird.y);
                ctx.stroke();
            }
        }
        
        function checkCollisions(bird) {
            // Check collision with pigs
            pigs.forEach((pig, pigIndex) => {
                const dx = bird.x - pig.x;
                const dy = bird.y - pig.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < bird.radius + pig.radius) {
                    // Pig hit
                    pigs.splice(pigIndex, 1);
                    createExplosion(bird.x, bird.y, bird.color);
                }
            });
            
            // Check collision with blocks
            blocks.forEach((block, blockIndex) => {
                // Simple collision detection between circle and rectangle
                let testX = bird.x;
                let testY = bird.y;
                
                if (bird.x < block.x) testX = block.x;
                else if (bird.x > block.x + block.width) testX = block.x + block.width;
                
                if (bird.y < block.y) testY = block.y;
                else if (bird.y > block.y + block.height) testY = block.y + block.height;
                
                const distX = bird.x - testX;
                const distY = bird.y - testY;
                const distance = Math.sqrt(distX * distX + distY * distY);
                
                if (distance <= bird.radius) {
                    // Block hit
                    block.health--;
                    if (block.health <= 0) {
                        blocks.splice(blockIndex, 1);
                    }
                    createExplosion(bird.x, bird.y, bird.color);
                }
            });
        }
        
        function createExplosion(x, y, color) {
            // Create explosion particles
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                
                birds.push({
                    x: x,
                    y: y,
                    radius: Math.random() * 5 + 2,
                    color: color,
                    velocity: {
                        x: Math.cos(angle) * speed,
                        y: Math.sin(angle) * speed
                    },
                    launched: true,
                    inSlingshot: false
                });
            }
        }
        
        // Event listeners
        startButton.addEventListener('click', () => {
            welcomeScreen.style.display = 'none';
            gameStarted = true;
            loadBackgrounds();
            initGame();
            gameLoop();
        });
        
        nextLevelButton.addEventListener('click', () => {
            levelComplete.style.display = 'none';
            currentLevel++;
            if (currentLevel > 3) {
                currentLevel = 1;
            }
            initGame();
        });
        
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // Check if clicked on the bird in slingshot
            if (currentBird && currentBird.inSlingshot) {
                const dx = mouseX - currentBird.x;
                const dy = mouseY - currentBird.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < currentBird.radius) {
                    isDragging = true;
                    dragStart.x = mouseX;
                    dragStart.y = mouseY;
                }
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging && currentBird && currentBird.inSlingshot) {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                // Limit how far back the bird can be pulled
                const maxPull = 150;
                const dx = mouseX - slingshot.x;
                const dy = mouseY - slingshot.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > maxPull) {
                    const angle = Math.atan2(dy, dx);
                    currentBird.x = slingshot.x + Math.cos(angle) * maxPull;
                    currentBird.y = slingshot.y + Math.sin(angle) * maxPull;
                } else {
                    currentBird.x = mouseX;
                    currentBird.y = mouseY;
                }
            }
        });
        
        canvas.addEventListener('mouseup', (e) => {
            if (isDragging && currentBird && currentBird.inSlingshot) {
                isDragging = false;
                birdLaunched = true;
                
                // Launch the bird
                const power = 0.2;
                currentBird.velocity.x = (slingshot.x - currentBird.x) * power;
                currentBird.velocity.y = (slingshot.y - currentBird.y) * power;
                currentBird.launched = true;
                currentBird.inSlingshot = false;
                
                // Add a new bird to the slingshot after a delay
                setTimeout(() => {
                    if (pigs.length > 0 && !levelCompleted) {
                        birds.push({
                            x: slingshot.x,
                            y: slingshot.y,
                            radius: 20,
                            color: '#ff0000',
                            velocity: { x: 0, y: 0 },
                            launched: false,
                            inSlingshot: true
                        });
                        currentBird = birds[birds.length - 1];
                        birdLaunched = false;
                    }
                }, 1000);
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const mouseEvent = new MouseEvent('mouseup');
            canvas.dispatchEvent(mouseEvent);
        });
    </script>
</body>
</html>
